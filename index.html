<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ocean1 HPC - Frontier Computing for Minimal Resources</title>
    <meta name="description" content="High-performance computing lab building powerful efficient systems for edge applications" />
    <meta name="author" content="Ocean1 HPC" />

    <meta property="og:title" content="Ocean1 HPC - Frontier Computing for Minimal Resources" />
    <meta property="og:description" content="High-performance computing lab building powerful efficient systems for edge applications" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
      :root {
        --color-background: #f0f5f9;
        --color-foreground: #1a2332;
        --color-primary: #0891c7;
        --color-secondary: #3d4f5f;
        --color-muted: #8a9bb0;
        --color-accent: #e5f1f8;
        --color-hero-bg: rgba(61, 79, 95, 0.9);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: var(--color-background);
        color: var(--color-foreground);
      }

      /* Header Styles */
      .header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        padding: 1.5rem 3rem;
      }

      .logo-container {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .logo-icon {
        width: 32px;
        height: 32px;
        border: 2px solid var(--color-primary);
        border-radius: 0.375rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo-text {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--color-foreground);
      }

      .careers-link {
        text-decoration: none;
        text-transform: uppercase;
        font-weight: 500;
        font-size: 0.875rem;
        letter-spacing: 0.1em;
        color: var(--color-foreground);
        transition: color 0.2s;
      }

      .careers-link:hover {
        color: var(--color-primary);
      }

      /* Hero Styles */
      .hero-section {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .hero-background {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: url('./assets/hero-background.jpg');
        background-size: cover;
        background-position: center;
      }

      .hero-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(to bottom, var(--color-hero-bg), rgba(61, 79, 95, 0.7), var(--color-hero-bg));
      }

      .hero-planet {
        position: absolute;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 800px;
        height: 800px;
        opacity: 0.6;
        pointer-events: none;
        background-image: url('./assets/planet.png');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center right;
      }

      .hero-content {
        position: relative;
        z-index: 10;
        max-width: 1280px;
        margin: 0 auto;
        padding: 6rem 3rem;
      }

      .hero-title {
        font-family: 'Space Mono', monospace;
        font-size: clamp(3rem, 7vw, 5rem);
        font-weight: 700;
        line-height: 1.1;
        color: var(--color-accent);
        margin-bottom: 1.5rem;
      }

      .hero-description {
        font-size: clamp(1.125rem, 2vw, 1.25rem);
        color: var(--color-muted);
        max-width: 42rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }

      .hero-button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        background-color: rgba(247, 250, 251, 0.1);
        color: var(--color-accent);
        border: 1px solid rgba(138, 155, 176, 0.3);
        border-radius: 0.5rem;
        backdrop-filter: blur(10px);
        font-size: 1.125rem;
        font-weight: 500;
        text-decoration: none;
        transition: all 0.3s;
        cursor: pointer;
      }

      .hero-button:hover {
        background-color: rgba(247, 250, 251, 0.2);
        border-color: rgba(138, 155, 176, 0.5);
        color: var(--color-accent);
      }

      .hero-button:hover .arrow-icon {
        transform: translateX(4px);
      }

      .arrow-icon {
        transition: transform 0.3s;
      }

      .hero-footer {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 10;
        padding: 2rem 3rem;
      }

      .footer-text {
        font-size: 0.875rem;
        color: var(--color-muted);
        margin: 0;
      }

      /* Responsive */
      @media (max-width: 991px) {
        .hero-planet {
          display: none;
        }
      }

      @media (max-width: 767px) {
        .header {
          padding: 1.5rem 1.5rem;
        }

        .hero-content {
          padding: 6rem 1.5rem;
        }

        .hero-footer {
          padding: 2rem 1.5rem;
        }
      }
    </style>
  </head>

  <body>
    <!-- Header -->
    <header class="header">
      <div class="container-xxl d-flex align-items-center justify-content-between">
        <div class="logo-container">
          <div class="logo-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0891c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="16" height="16" x="4" y="4" rx="2"/>
              <rect width="6" height="6" x="9" y="9" rx="1"/>
              <path d="M15 2v2"/>
              <path d="M15 20v2"/>
              <path d="M2 15h2"/>
              <path d="M2 9h2"/>
              <path d="M20 15h2"/>
              <path d="M20 9h2"/>
              <path d="M9 2v2"/>
              <path d="M9 20v2"/>
            </svg>
          </div>
          <span class="logo-text">Ocean1 HPC</span>
        </div>
        <a href="#careers" class="careers-link">Careers</a>
      </div>
    </header>

    <!-- Hero Section -->
    <section class="hero-section">
      <!-- Background Image -->
      <div class="hero-background">
        <div class="hero-overlay"></div>
      </div>

      <!-- Planet Decoration -->
      <div class="hero-planet d-none d-lg-block"></div>

      <!-- Content -->
      <div class="hero-content">
        <div style="max-width: 48rem;">
          <h1 class="hero-title">
            Frontier Computing for<br>
            Minimal Resources
          </h1>
          <p class="hero-description">
            We are a high-performance computing lab building powerful efficient systems for edge applications.
          </p>
          <a href="#contact" class="hero-button">
            Get in touch
            <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"/>
              <path d="m12 5 7 7-7 7"/>
            </svg>
          </a>
        </div>
      </div>

      <!-- Footer -->
      <div class="hero-footer">
        <div class="container-xxl d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
          <p class="footer-text">Email: info@ocean1hpc.com</p>
          <p class="footer-text">© 2025 Ocean1 HPC. All rights reserved.</p>
        </div>
      </div>
    </section>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
